name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      # 包括：无前视截断测试、原 SOP 精确复现、朴素实现对照、缓冲区与统计量性质、质量闸门、端到端
      - run: pytest -q
