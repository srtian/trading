name: Daily signal

# 22:15 UTC = 新加坡时间次日 06:15，晚于美股收盘（夏令时 20:00 UTC / 冬令时 21:00 UTC）
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "信号日（YYYY-MM-DD，留空=最近一个已收盘的纽交所交易日）"
        required: false

permissions:
  contents: write

concurrency:
  group: data-writer        # 与 Research 共用：串行读写数据缓存与提交
  cancel-in-progress: false

env:
  # 可选：在仓库 Settings → Secrets 里设置 DATA_REPO（如 srtian/trading-data，私有）和 DATA_REPO_TOKEN，
  # 原始数据就会长期保存在私有仓库并留下完整修订历史；未设置时使用 Actions 缓存。
  DATA_REPO: ${{ secrets.DATA_REPO }}

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Checkout private data repo
        if: env.DATA_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Restore data cache
        if: env.DATA_REPO == ''
        uses: actions/cache@v4
        with:
          path: data
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Build signal
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.asof }}" ]; then ARGS="--asof ${{ github.event.inputs.asof }}"; fi
          python -m etflab daily --config config/portfolio.yaml --data-dir data --out signals $ARGS

      - name: Push raw data to private repo
        if: env.DATA_REPO != ''
        working-directory: data
        run: |
          git config user.name "etflab-bot"
          git config user.email "etflab-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push

      - name: Commit signal
        run: |
          git config user.name "etflab-bot"
          git config user.email "etflab-bot@users.noreply.github.com"
          git add signals
          git diff --cached --quiet || git commit -m "signal: $(jq -r .asof signals/latest.json) [$(jq -r .status signals/latest.json)]"
          git pull --rebase --autostash origin main
          git push
